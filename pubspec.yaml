name: task_manager_tracker

description: A Flutter Task Manager Tracker with Firebase Auth, Firestore, Provider, and dynamic themes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  provider: ^6.1.5+1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
